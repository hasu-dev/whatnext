name: Daily rebuild

# Redeploys the site once a day so build-time artifacts that encode
# "days left" (OG images, countdowns baked into static output) stay fresh.
# Set the CLOUDFLARE_PAGES_DEPLOY_HOOK secret to the Pages deploy hook URL.
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK secret not set; skipping."
            exit 0
          fi
          curl -sf -X POST "$HOOK"
