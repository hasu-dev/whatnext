name: Deploy

# Deploys the site (assets + Pages Functions) on every push to main, and
# once a day so build-time artifacts that encode "days left" (OG images,
# countdowns) stay fresh.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID — aafa135c44b9dde47df00be165b87346
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=whatnext
